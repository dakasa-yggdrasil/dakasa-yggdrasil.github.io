<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD1C5"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#A78BFA" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#0A0E0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0E0F"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Yggdrasil mark: stylised Y + paper-grain dot trio -->
  <g transform="translate(96,250) scale(5.0)" fill="none">
    <path d="M8 7l4 5v5" stroke="#4FD1C5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 7l-4 5" stroke="#4FD1C5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="6" cy="18" r="0.8" fill="#4FD1C5" opacity="0.6"/>
    <circle cx="9" cy="18" r="0.8" fill="#4FD1C5" opacity="0.4"/>
    <circle cx="12" cy="18" r="0.8" fill="#4FD1C5" opacity="0.25"/>
  </g>

  <!-- wordmark -->
  <text x="232" y="232" font-family="Space Grotesk, Arial, sans-serif" font-size="40" font-weight="700" fill="#E9EFEE" letter-spacing="1">YGGDRASIL</text>

  <!-- headline -->
  <text x="232" y="318" font-family="Space Grotesk, Arial, sans-serif" font-size="62" font-weight="700" fill="#E9EFEE">O control plane self-hosted</text>
  <text x="232" y="392" font-family="Space Grotesk, Arial, sans-serif" font-size="62" font-weight="700" fill="url(#aurora)">do seu stack inteiro.</text>

  <!-- sub -->
  <text x="234" y="452" font-family="Inter, Arial, sans-serif" font-size="26" fill="#97A6A3">Workflows declarativos · integrações plugáveis · surfaces sob medida</text>

  <!-- footer pill -->
  <rect x="232" y="500" width="430" height="46" rx="23" fill="none" stroke="#2DD4BF" stroke-opacity=".4"/>
  <circle cx="262" cy="523" r="5" fill="#4FD1C5"/>
  <text x="280" y="531" font-family="JetBrains Mono, monospace" font-size="20" fill="#97A6A3">Open source · Apache-2.0 · self-hosted</text>
</svg>
