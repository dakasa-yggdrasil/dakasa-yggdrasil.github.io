<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#A78BFA" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#0A0E0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0E0F"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- world-tree mark -->
  <g transform="translate(92,250) scale(3.4)" fill="none" stroke="url(#aurora)" stroke-width="1.5" stroke-linecap="round">
    <path d="M16 5v22"/>
    <path d="M16 12l-6-4M16 12l6-4M16 18l-7 4M16 18l7 4"/>
    <path d="M16 27c-3 0-5-2-7-3M16 27c3 0 5-2 7-3"/>
  </g>
  <g transform="translate(92,250) scale(3.4)" fill="url(#aurora)">
    <circle cx="16" cy="5" r="2"/><circle cx="10" cy="8" r="1.6"/><circle cx="22" cy="8" r="1.6"/>
    <circle cx="9" cy="22" r="1.6"/><circle cx="23" cy="22" r="1.6"/><circle cx="16" cy="18" r="1.8"/>
  </g>

  <!-- wordmark -->
  <text x="232" y="232" font-family="Space Grotesk, Arial, sans-serif" font-size="40" font-weight="700" fill="#E9EFEE" letter-spacing="1">YGGDRASIL</text>

  <!-- headline -->
  <text x="232" y="318" font-family="Space Grotesk, Arial, sans-serif" font-size="62" font-weight="700" fill="#E9EFEE">O control plane self-hosted</text>
  <text x="232" y="392" font-family="Space Grotesk, Arial, sans-serif" font-size="62" font-weight="700" fill="url(#aurora)">do seu stack inteiro.</text>

  <!-- sub -->
  <text x="234" y="452" font-family="Inter, Arial, sans-serif" font-size="27" fill="#97A6A3">Workflows declarativos · integrações plugáveis · uma CLI para o ciclo de vida todo</text>

  <!-- footer pill -->
  <rect x="232" y="500" width="430" height="46" rx="23" fill="none" stroke="#2DD4BF" stroke-opacity=".4"/>
  <circle cx="262" cy="523" r="5" fill="#34D399"/>
  <text x="280" y="531" font-family="JetBrains Mono, monospace" font-size="20" fill="#97A6A3">Open source · Apache-2.0 · self-hosted</text>
